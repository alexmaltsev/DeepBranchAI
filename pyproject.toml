[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepbranchai"
version = "1.0.0"
description = "A transferable 3D nnU-Net checkpoint for branching-network segmentation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "CC0-1.0"
license-files = ["LICENSE"]
authors = [
  { name = "Alexander V. Maltsev" },
  { name = "Lisa M. Hartnell" },
  { name = "Luigi Ferrucci" },
]
keywords = ["3D segmentation", "branching networks", "nnU-Net", "transfer learning", "FIB-SEM"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy",
  "nibabel",
  "tifffile",
  "matplotlib",
  "pandas",
  "scikit-learn",
  "scipy",
  "scikit-image",
  "connected-components-3d",
  "SimpleITK",
]

[project.optional-dependencies]
nnunet = ["nnunetv2==2.3.1"]
notebooks = ["jupyter", "ipykernel"]
dev = ["build", "pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/alexmaltsev/DeepBranchAI"
Repository = "https://github.com/alexmaltsev/DeepBranchAI"
Artifacts = "https://zenodo.org/records/19363534"

[tool.setuptools]
packages = ["deepbranchai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
